<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rex (keyed)</title>
    <style>
      body { padding: 10px 0 0 0; margin: 0; overflow-y: scroll; font-family: system-ui, sans-serif; }
      .container { max-width: 1100px; margin: 0 auto; padding: 0 15px; }
      .jumbotron { padding: 10px 0; background: #eee; margin-bottom: 20px; }
      .row { display: flex; flex-wrap: wrap; }
      .col-md-6 { flex: 0 0 50%; }
      .col-sm-6 { flex: 0 0 50%; }
      .smallpad { padding: 5px; box-sizing: border-box; }
      .btn { width: 100%; padding: 6px 12px; border: 1px solid #2e6da4; border-radius: 4px; background: #337ab7; color: #fff; cursor: pointer; }
      table { width: 100%; border-collapse: collapse; }
      td { padding: 4px 8px; border-top: 1px solid #ddd; }
      .table-striped tr:nth-child(odd) { background: #f9f9f9; }
      tr.danger { background: #f2dede !important; }
      .test-data a { display: block; cursor: pointer; }
      .col-md-1 { width: 8%; } .col-md-4 { width: 33%; } .col-md-6 { width: 50%; }
      .glyphicon { display: inline-block; }
      .glyphicon-remove::before { content: "\2715"; }
      .remove { cursor: pointer; }
      .preloadicon { position: absolute; top: -20px; left: -20px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
