<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rex TodoMVC</title>
    <style>
      body { font: 14px system-ui, sans-serif; background: #f5f5f5; margin: 0; }
      #app { max-width: 550px; margin: 40px auto; }
      .todoapp { background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); }
      h1 { font-size: 64px; font-weight: 200; color: #b83f45; text-align: center; margin: 0; }
      .todoapp input[type=text], .new-todo, .edit { font: inherit; font-size: 20px; padding: 12px; width: 100%; box-sizing: border-box; border: 0; }
      .new-todo { background: rgba(0,0,0,.003); box-shadow: inset 0 -2px 1px rgba(0,0,0,.03); }
      .todo-list { list-style: none; margin: 0; padding: 0; }
      .todo-list li { display: block; padding: 8px 12px; border-bottom: 1px solid #ededed; font-size: 20px; }
      .todo-list li .view { display: flex; gap: 12px; align-items: center; }
      .todo-list li .view label { flex: 1; }
      .todo-list li.completed label { color: #949494; text-decoration: line-through; }
      .todo-list li .edit { display: none; }
      .todo-list li.editing .view { display: none; }
      .todo-list li.editing .edit { display: block; }
      .destroy { border: 0; background: none; color: #a94442; font-size: 22px; cursor: pointer; }
      .footer { display: flex; gap: 16px; align-items: center; padding: 10px 15px; color: #777; }
      .filters { list-style: none; display: flex; gap: 8px; margin: 0 auto; padding: 0; }
      .filters a { cursor: pointer; padding: 2px 7px; border: 1px solid transparent; border-radius: 3px; }
      .filters a.selected { border-color: #ce4646; }
      .clear-completed { border: 0; background: none; color: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
